<!doctype html>
<html lang="nl">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Van Driving Scene</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #111827;

      canvas {
        display: block;
      }

      .controls-hint {
        position: fixed;
        top: 1rem;
        left: 1rem;
        margin: 0;
        padding: 0.65rem 0.9rem;
        border-radius: 0.5rem;
        color: #0f172a;
        background: rgb(255 255 255 / 85%);
        font: 14px/1.5 system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <p class="controls-hint">Besturing: Z/S vooruit en achteruit, Q/D sturen — of gebruik de pijltjestoetsen.</p>
